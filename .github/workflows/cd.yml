name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag API image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/api:latest -f Dockerfile.api .

      - name: Build and tag UI image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/ui:latest -f Dockerfile.ui .

      - name: Push API image
        run: docker push ${{ secrets.DOCKERHUB_USER }}/api:latest

      - name: Push UI image
        run: docker push ${{ secrets.DOCKERHUB_USER }}/ui:latest